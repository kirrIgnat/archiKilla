name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artem
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: artem_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artem -d artem_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgres://artem:ci_only_password@localhost:5432/artem_test?sslmode=disable
      - run: go build ./cmd/server ./cmd/bot
